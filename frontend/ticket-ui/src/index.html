<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Triage - Smart AI Ticket Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply initial theme immediately before Angular loads
    (function() {
      const saved = localStorage.getItem('ticket-ui-theme');
      let theme;
      if (saved === 'light' || saved === 'dark') {
        theme = saved;
      } else {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();

    (function() {
      const savedLanguage = localStorage.getItem('preferredLang');
      const lang = savedLanguage === 'en' || savedLanguage === 'fr' || savedLanguage === 'ar'
        ? savedLanguage
        : 'fr';

      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
