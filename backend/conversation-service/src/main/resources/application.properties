server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=rag_user
spring.datasource.password=${DB_PASSWORD:rag_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ticket Service integration
ticket.service.url=http://localhost:8081

# AI Service integration (Gemini classification + priority estimation)
ai.service.url=http://localhost:8085

# Internal service-to-service authentication
internal.service-secret=${INTERNAL_SERVICE_SECRET:my-super-secret-internal-key-for-service-to-service-communication-only}

# Security config will be picked from existing packages
