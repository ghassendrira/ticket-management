spring.application.name=rag-backend
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=${DB_USER:rag_user}
spring.datasource.password=${DB_PASSWORD:rag_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.storage.documents-dir=uploads
app.storage.max-file-size=10485760

jwt.secret=${JWT_SECRET:changeme-en-production-avec-une-vraie-cle-secrete}
jwt.expiration-ms=86400000

# Ollama Configuration
rag.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rag.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
rag.ollama.llm-model=${OLLAMA_LLM_MODEL:qwen2.5:14b}

# LLM Parameters
rag.llm.temperature=${RAG_LLM_TEMPERATURE:0.3}
rag.llm.max-tokens=${RAG_LLM_MAX_TOKENS:2048}

# Chunking Configuration
rag.chunk.size=${RAG_CHUNK_SIZE:500}
rag.chunk.overlap=${RAG_CHUNK_OVERLAP:100}

# Search Configuration
rag.top-k=${RAG_TOP_K:5}
rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.70}

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
springdoc.enable-spring-security-oauth2=false
springdoc.use-fqn=false
