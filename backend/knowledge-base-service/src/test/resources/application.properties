spring.application.name=rag-backend-tests
server.port=0

spring.datasource.url=jdbc:h2:mem:ragdb_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.storage.documents-dir=target/test-uploads
app.storage.max-file-size=10485760

rag.ollama.base-url=http://localhost:11434
rag.ollama.embedding-model=nomic-embed-text
rag.ollama.llm-model=llama3.2:3b

rag.chunk.size=500
rag.chunk.overlap=100

rag.top-k=5
rag.similarity-threshold=0.70

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
