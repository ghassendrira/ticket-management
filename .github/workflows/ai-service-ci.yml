name: AI Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  build-ai-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven project
        run: ./mvnw --version

      - name: Build and test AI Service
        run: ./mvnw clean verify