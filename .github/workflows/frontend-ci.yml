name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/ticket-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/ticket-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Debug environment file
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Environment directory ==="
          ls -la src/environments

          echo "=== Development environment file ==="
          ls -la src/environments/environment.development.ts

          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Git tracked file ==="
          git ls-files src/environments/environment.development.ts

      - name: Build Angular application
        run: npm run build
