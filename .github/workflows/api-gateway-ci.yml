name: API Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build-api-gateway:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test API Gateway
        run: mvn clean verify