name: Embedding Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/embedding-service/**'
      - '.github/workflows/embedding-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/embedding-service/**'
      - '.github/workflows/embedding-service-ci.yml'

jobs:
  test-embedding-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/embedding-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/embedding-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v