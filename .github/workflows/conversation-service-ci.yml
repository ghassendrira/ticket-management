name: Conversation Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/conversation-service/**'
      - '.github/workflows/conversation-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/conversation-service/**'
      - '.github/workflows/conversation-service-ci.yml'

jobs:
  build-conversation-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/conversation-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test Conversation Service
        run: mvn clean verify