services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: ticket-auth-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  ticket-service:
    build:
      context: ../backend/ticket-service
      dockerfile: Dockerfile
    container_name: ticket-ticket-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticket_management
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
      AUTH_SERVICE_URL: http://auth-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      UPLOAD_BASE_DIR: /uploads
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  notification-service:
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    container_name: ticket-notification-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8084
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  assignment-service:
    build:
      context: ../backend/assignment-service
      dockerfile: Dockerfile
    container_name: ticket-assignment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/assignment_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: ticket-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - ticket-service
      - notification-service
      - assignment-service

volumes:
  postgres_data:
  uploads_data: